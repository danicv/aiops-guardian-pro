services:
  langfuse-web:
    environment:
      LANGFUSE_LLM_CONNECTION_WHITELISTED_HOST: ollama
    ports: !override
      - 127.0.0.1:3000:3000
  minio:
    ports: !override
      - 127.0.0.1:9090:9000
      - 127.0.0.1:9091:9001
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  ollama_data:
    driver: local
