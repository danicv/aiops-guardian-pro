<path class="line" d="M1965 855 V1000 H890 V1080"/>
<path class="dash" d="M1525 690 V1030 H1450 V1080"/>
<path class="dash" d="M890 1320 V1345 H2022 V1320"/>

<!-- Lane 4 -->
<rect x="55" y="1400" width="2290" height="245" rx="18" fill="#f7fafc" stroke="#91a7bf" stroke-width="2"/>
<text x="80" y="1433" class="laneTitle">4. AKS Runtime, Observability &amp; Terraform Infrastructure</text>

<rect class="box" x="90" y="1470" width="600" height="125" fill="#eaf2fc" stroke="#7398c3"/>
<text x="390" y="1502" text-anchor="middle" class="boxTitle">Azure / AKS Platform</text><text x="390" y="1530" text-anchor="middle" class="text">AKS • ACR • VNet/Subnets • Managed/Workload Identity</text><text x="390" y="1554" text-anchor="middle" class="text">Key Vault • Kubernetes RBAC • Persistent Storage</text><text x="390" y="1577" text-anchor="middle" class="small">Frontend, backend, MCP, Langflow, PostgreSQL demo run as workloads.</text>

<rect class="box" x="755" y="1470" width="600" height="125" fill="#e9f4f4" stroke="#72a7a7"/>
<text x="1055" y="1502" text-anchor="middle" class="boxTitle">OpenTelemetry Sidecar Pattern</text><text x="1055" y="1530" text-anchor="middle" class="text">Each core pod → local OTel Collector sidecar → central gateway</text><text x="1055" y="1554" text-anchor="middle" class="text">Prometheus metrics • Loki logs • Tempo traces • Grafana dashboards</text><text x="1055" y="1577" text-anchor="middle" class="small">Observe orchestrator, agents, MCP calls, guardrails, approvals and remediation.</text>

<rect class="box" x="1420" y="1470" width="440" height="125" fill="#ddeaff" stroke="#668ebd"/>
<text x="1640" y="1502" text-anchor="middle" class="boxTitle">Terraform</text><text x="1640" y="1530" text-anchor="middle" class="text">RG • VNet • AKS • ACR • Identity</text><text x="1640" y="1554" text-anchor="middle" class="text">Key Vault • RBAC • LB/Ingress • monitoring</text><text x="1640" y="1577" text-anchor="middle" class="small">Infrastructure as Code for repeatable environments.</text>

<rect class="box" x="1925" y="1470" width="380" height="125" fill="#eef4fb" stroke="#9db2ca"/>
<text x="2115" y="1502" text-anchor="middle" class="boxTitle">Closed-Loop Learning</text><text x="2115" y="1530" text-anchor="middle" class="text">Release → Observe → RCA → Approve</text><text x="2115" y="1554" text-anchor="middle" class="text">Remediate → Verify → Store outcome</text><text x="2115" y="1577" text-anchor="middle" class="small">History improves future release-risk decisions.</text>

<path class="dash" d="M890 1320 V1450 H390 V1470"/><path class="dash" d="M1450 1320 V1450 H2115 V1470"/><path class="line" d="M690 1532 H755"/><path class="line" d="M1355 1532 H1420"/><path class="line" d="M1860 1532 H1925"/>

<!-- footer -->
<text x="1200" y="1680" text-anchor="middle" class="small">Key separation: LangGraph orchestrates • Agents reason • MCP provides tools • Guardrails govern • Humans approve • OTel observes • Terraform provisions</text>
</svg>