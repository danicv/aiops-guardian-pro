<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
<defs>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#172033}.subtitle{font:18px Arial,sans-serif;fill:#5b6778}
    .laneTitle{font:700 20px Arial,sans-serif;fill:#263247}.boxTitle{font:700 17px Arial,sans-serif;fill:#182234}
    .text{font:15px Arial,sans-serif;fill:#3f4a5c}.small{font:13px Arial,sans-serif;fill:#596678}
    .box{rx:14;ry:14;stroke-width:2}.line{stroke:#718096;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#7b8797;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    .lightline{stroke:#a6b0bf;stroke-width:1.7;fill:none;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker>
