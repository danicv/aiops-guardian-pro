apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardian-backend
  namespace: aiops-guardian
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://guardian:guardian@postgres:5432/guardian
            - name: AUTH_REQUIRED
              value: "false"
            - name: MCP_SERVER_URL
              value: http://guardian-mcp:8001
            - name: CORS_ORIGINS
              value: http://localhost:30080,http://localhost:30081
            - name: PROMETHEUS_URL
              value: http://guardian-prometheus:9090
