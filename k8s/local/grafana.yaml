apiVersion: v1
kind: ConfigMap
metadata:
  name: guardian-grafana-provisioning
  namespace: aiops-guardian
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: guardian-prometheus
        type: prometheus
        access: proxy
        url: http://guardian-prometheus:9090
        isDefault: true
        editable: true
      - name: Loki
        uid: guardian-loki
        type: loki
        access: proxy
        url: http://guardian-loki:3100
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Guardian
        orgId: 1
        folder: Guardian
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/guardian
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guardian-grafana-data
  namespace: aiops-guardian
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardian-grafana
  namespace: aiops-guardian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardian-grafana
  template:
    metadata:
      labels:
        app: guardian-grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: guardian-local
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/guardian
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: guardian-grafana-data
        - name: provisioning
          configMap:
            name: guardian-grafana-provisioning
        - name: dashboard
          configMap:
            name: guardian-grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: guardian-grafana
  namespace: aiops-guardian
spec:
  selector:
    app: guardian-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
