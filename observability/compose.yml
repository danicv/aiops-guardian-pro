# Standalone local metrics stack; no database or application secrets required.
services:
  checkout-api:
    build: ../demo/checkout-api
    environment:
      SERVICE_NAME: checkout-api
      ENVIRONMENT: prod
      NAMESPACE: default
    ports: ["127.0.0.1:18080:8080"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/standalone.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:19090:9090"]
